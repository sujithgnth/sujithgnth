name: Animated contribution graph

on:
  schedule:
    - cron: '43 4 * * *'   # daily
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/**
      - .github/workflows/graph.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: graph
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build dist/graph.svg
        run: node scripts/build-graph.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/graph.svg
          if git diff --cached --quiet; then
            echo "graph unchanged"
          else
            git commit -m "Update animated contribution graph"
            git push
          fi
